<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DezoCloud</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="256x256" href="./favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DezoCloud">
<link rel="stylesheet" href="./css/app.css">
<script>try{var t=localStorage.getItem('dc-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div id="offbar" role="status">Internet yo'q: oxirgi saqlangan ma'lumotlar ko'rsatilmoqda</div>
<div class="app" id="app">
  <header class="top" id="top">
    <div class="brand">
      <button class="icon-btn" id="menu-btn" aria-label="Menyu"></button>
      <img class="logo-img on-light" src="./logo-light.png" alt="DezoCloud" style="height:24px"><img class="logo-img on-dark" src="./logo-dark.png" alt="" aria-hidden="true" style="height:24px">
    </div>
    <div class="search">
      <button class="icon-btn" id="search-back" aria-label="Qidiruvni yopish" data-icon="search"></button>
      <input id="search" type="search" placeholder="Fayl nomi bo'yicha qidirish" autocomplete="off">
      <button class="icon-btn" id="search-clear" aria-label="Tozalash" hidden data-icon="close"></button>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn only-wide" id="plus-btn" aria-label="Yaratish va yuklash" title="Yuklash" data-icon="add"></button>
    <button class="icon-btn only-wide" id="help-btn" aria-label="Yordam" title="Yordam" data-icon="help"></button>
    <button class="icon-btn only-wide" id="gear-btn" aria-label="Sozlamalar" title="Sozlamalar" data-icon="settings"></button>
    <button class="icon-btn only-wide" id="apps-btn" aria-label="Bo'limlar" title="Bo'limlar" data-icon="apps"></button>
    <button class="icon-btn only-narrow" id="upload-icon" aria-label="Yuklash" data-icon="add"></button>
    <button class="avatar" id="avatar" aria-label="Hisob">?</button>
  </header>

  <aside class="side" id="side">
    <div class="side-brand"><img class="logo-img on-light" src="./logo-light.png" alt="DezoCloud" style="height:26px"><img class="logo-img on-dark" src="./logo-dark.png" alt="" aria-hidden="true" style="height:26px"></div>
    <nav class="nav" id="nav">
      <button data-view="photos"><span data-icon="photo"></span>Fotolar<span class="count" id="c-photos"></span></button>
      <div class="navlabel">To'plamlar</div>
      <button data-view="albums"><span data-icon="album"></span>Albomlar</button>
      <button data-view="places"><span data-icon="place"></span>Joylar<span class="count" id="c-places"></span></button>
      <button data-view="videos"><span data-icon="video"></span>Videolar<span class="count" id="c-videos"></span></button>
      <button data-view="favorites"><span data-icon="star"></span>Sevimlilar<span class="count" id="c-fav"></span></button>
      <button data-view="recent"><span data-icon="recent"></span>Yaqinda qo'shilgan</button>
      <button data-view="archive"><span data-icon="archive"></span>Arxiv<span class="count" id="c-arch"></span></button>
      <hr>
      <button data-view="trash"><span data-icon="delete"></span>Savatcha<span class="count" id="c-trash"></span></button>
    </nav>
    <div class="meter" id="meter" hidden role="button" tabindex="0" title="Xotirani boshqarish">
      <div class="mtitle"><span data-icon="cloud"></span>Xotira</div>
      <div class="bar"><i id="meter-fill"></i></div>
      <div id="meter-text"></div>
      <button class="btn sm" id="more-space" type="button">Ko'proq joy so'rash</button>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main" id="main"></main>
</div>

<div class="selbar" id="selbar" hidden></div>
<button class="fab" id="fab" aria-label="Yuklash" data-icon="upload"></button>
<nav class="tabbar" id="tabbar">
  <div class="tabs-pill">
    <button data-view="photos"><span data-icon="photo"></span><b>Fotolar</b></button>
    <button data-view="collections"><span data-icon="album"></span><b>To'plamlar</b></button>
    <button data-view="upload"><span data-icon="upload"></span><b>Yuklash</b></button>
  </div>
  <button class="tab-search" data-view="search" aria-label="Qidiruv"><span data-icon="search"></span></button>
</nav>
<input type="file" id="file" accept="image/*,video/*,.heic,.heif,.mkv,.mts,.m2ts" multiple hidden>
<div id="overlay-root"></div>

<script src="./js/mock.js"></script>
<script src="./js/app.js" type="module"></script>
</body>
</html>
