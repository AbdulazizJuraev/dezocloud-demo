<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DezoCloud — Kirish</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="256x256" href="./favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DezoCloud">
<link rel="stylesheet" href="./css/app.css">
<script>try{var t=localStorage.getItem('dc-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
  .social { display: grid; gap: 10px; }
  .social .gwrap { display: grid; justify-items: center; }
  .sbtn {
    display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; height: 44px;
    border: 1px solid var(--line); border-radius: 22px; background: var(--bg); font-weight: 500; font-size: 14px;
  }
  .sbtn:hover { background: var(--bg-2); }
  .sbtn svg { width: 18px; height: 18px; flex: none; }
  .linkbtn { border: 0; background: transparent; color: var(--accent); font-weight: 500; padding: 10px; margin: 2px auto 0; display: block; border-radius: 8px; }
  .linkbtn:hover { background: var(--accent-bg); }
  .codebox { display: grid; gap: 10px; padding: 14px; background: var(--accent-bg); border-radius: 10px; }
  .codebox p { margin: 0; font-size: 13px; }
  .codebox .btn, .emailbox .btn { width: 100%; }
  .emailbox { display: grid; gap: 10px; }
  .emailbox .hint { margin: 0; font-size: 13px; color: var(--muted); }
  .legal { margin: 4px 0 0; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.5; }
  .legal a { color: var(--muted); }
  .otp { letter-spacing: .4em; text-align: center; font-size: 20px; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth">
    <img class="logo-img on-light" src="./logo-light.png" alt="DezoCloud"><img class="logo-img on-dark" src="./logo-dark.png" alt="" aria-hidden="true">
    <h1 id="title">Kirish</h1>
    <p class="sub" id="sub">Surat va videolaringiz — bir joyda</p>

    <!-- Tezkor kirish usullari: sozlangan bo'lsagina ko'rinadi -->
    <div id="social" class="social" hidden>
      <div class="gwrap"><div id="g-btn" style="width:100%;display:flex;justify-content:center"></div></div>
      <div id="oa-btns" style="display:grid;gap:10px"></div>
      <button type="button" class="sbtn" id="email-btn" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
        Pochta orqali kod bilan</button>

      <div class="emailbox" id="emailbox" hidden>
        <label class="field"><span>Pochta manzilingiz</span><input id="em" type="email" autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="ism@pochta.com"></label>
        <button class="btn primary" id="em-send" type="button">Kod yuborish</button>
        <div id="em-step2" hidden style="display:grid;gap:10px">
          <p class="hint" id="em-hint"></p>
          <label class="field"><span>Pochtaga kelgan 6 xonali kod</span><input id="otp" class="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······"></label>
          <button class="btn primary" id="em-verify" type="button">Kirish</button>
        </div>
      </div>

      <div class="codebox" id="codebox" hidden>
        <p><b>Birinchi marta kiryapsiz.</b> Administrator bergan taklif kodini kiriting:</p>
        <label class="field"><span>Taklif kodi</span><input id="gcode" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX"></label>
        <button class="btn primary" id="gcode-go" type="button">Davom etish</button>
      </div>
      <button type="button" class="linkbtn" id="show-form">Login va parol bilan kirish</button>
    </div>

    <form id="form" autocomplete="on" style="display:grid;gap:14px">
      <div class="tabs" id="tabs" hidden>
        <button type="button" data-mode="login" class="on">Kirish</button>
        <button type="button" data-mode="register">Ro'yxatdan o'tish</button>
      </div>

      <label class="field" id="f-code" hidden>
        <span>Taklif kodi</span>
        <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX">
        <small>Kodni sizga DezoCloud administratori bergan.</small>
      </label>
      <label class="field">
        <span>Login</span>
        <input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="3" maxlength="32">
      </label>
      <label class="field">
        <span>Parol</span>
        <input id="password" type="password" autocomplete="current-password" required>
        <small id="pwhint" hidden>Kamida 8 ta belgi.</small>
      </label>

      <div class="msg" id="msg" role="alert"></div>
      <button class="btn primary" id="go" type="submit">Kirish</button>
    </form>
    <p class="legal">Davom etish orqali <a href="./terms.html">Foydalanish shartlari</a> va <a href="./privacy.html">Maxfiylik siyosatiga</a> rozilik bildirasiz.</p>
  </div>
</div>

<script src="./js/mock.js"></script>
<script>
(() => {
  try { caches.keys().then((ks) => ks.filter((k) => k.startsWith('dc-api') || k.startsWith('dc-thumbs') || k === 'dc-offline').forEach((k) => caches.delete(k))); } catch (e) {}
  const $ = (s) => document.querySelector(s);
  let mode = 'login';
  let regMode = 'invite';
  let googleCredential = null;   // kod kerak bo'lib qolsa, tokenni saqlab turamiz
  let pending = null;            // taklif kodi kutilayotgan usul: 'google' | 'email' | provayder nomi
  let demoMode = false;
  // Ilova rejimi: ?app=1 — brauzerda kirib, ilovaga qaytamiz; DezoCloudApp — ilova ichidagi WebView
  const APP_MODE = new URLSearchParams(location.search).get('app') === '1';
  const IN_APP = /DezoCloudApp/.test(navigator.userAgent) && !!window.DezoApp;
  const goHome = () => { location.href = './'; };

  const ICONS = {
    yandex: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#FC3F1D"/><path fill="#fff" d="M13.6 19.2h2.2V4.8h-3.2c-3.2 0-4.8 1.6-4.8 4 0 1.9.9 3.1 2.6 4.2l-3 6.2h2.3l3.3-6.8-1.1-.7c-1.3-.9-1.9-1.6-1.9-3 0-1.4.9-2.3 2.6-2.3h1v12.8z"/></svg>',
    microsoft: '<svg viewBox="0 0 24 24"><path fill="#F25022" d="M2 2h9.5v9.5H2z"/><path fill="#7FBA00" d="M12.5 2H22v9.5h-9.5z"/><path fill="#00A4EF" d="M2 12.5h9.5V22H2z"/><path fill="#FFB900" d="M12.5 12.5H22V22h-9.5z"/></svg>',
    facebook: '<svg viewBox="0 0 24 24"><path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>',
  };
  const NAMES = { yandex: 'Yandex', microsoft: 'Microsoft', facebook: 'Facebook' };

  const apply = () => {
    const reg = mode === 'register';
    $('#title').textContent = reg ? "Ro'yxatdan o'tish" : 'Kirish';
    $('#go').textContent = reg ? "Ro'yxatdan o'tish" : 'Kirish';
    $('#f-code').hidden = !reg;
    $('#pwhint').hidden = !reg;
    $('#password').autocomplete = reg ? 'new-password' : 'current-password';
    $('#msg').textContent = '';
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.mode === mode));
  };

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const showCodebox = (html) => { $('#codebox').hidden = false; if (html) $('#codebox p').innerHTML = html; $('#gcode').focus(); };
  const inviteCode = () => $('#gcode').value || $('#code').value;
  const post = (url, body) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(async (r) => ({ r, j: await r.json().catch(() => ({})) }));

  // Login-parol formasi: tezkor usullar bor bo'lsa yashirin, havola bilan ochiladi
  const tuckForm = () => { if (!$('#form').dataset.opened) $('#form').hidden = true; };
  const openForm = () => { $('#form').dataset.opened = '1'; $('#form').hidden = false; $('#show-form').hidden = true; };
  $('#show-form').onclick = () => { openForm(); $('#username').focus(); };

  // ── Google ─────────────────────────────────────────────────────
  async function googleLogin(credential, code) {
    $('#msg').textContent = '';
    const { r, j } = await post('/api/auth/google', { credential, code });
    if (r.ok) { goHome(); return; }
    if (j.needCode) {
      googleCredential = credential; pending = 'google';
      showCodebox(j.email ? `<b>${esc(j.email)}</b> bilan kirdingiz, bu pochta hali ro'yxatdan o'tmagan. Administrator bergan taklif kodini kiriting. Boshqa Google hisobi kerak bo'lsa, sahifani yangilab, tugmada shu hisobni tanlang:` : null);
      $('#msg').textContent = r.status === 428 ? '' : j.error;
      return;
    }
    $('#msg').textContent = j.error || `Xato ${r.status}`;
  }

  // Ilova (Android) hisob tanlangandan keyin tokenni shu yerga uzatadi
  window.onNativeGoogle = (token) => googleLogin(token);

  function setupGoogle(clientId) {
    $('#social').hidden = false;
    if (IN_APP) {   // Google WebView'da ishlamaydi: tizim brauzerida kirib, ilovaga qaytamiz
      $('#g-btn').innerHTML = `<button type="button" class="sbtn" id="g-app">
        <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
        Google bilan davom etish</button>`;
      $('#g-app').onclick = () => window.DezoApp.googleLogin();
      return;
    }
    if (clientId === 'demo') {            // namoyish: haqiqiy Google yo'q, tugma nusxasi
      demoMode = true;
      $('#g-btn').innerHTML = `<button type="button" class="sbtn" id="g-fake">
        <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.700l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
        Google bilan davom etish</button>`;
      $('#g-fake').onclick = () => { location.href = './'; };
      return;
    }
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true;
    s.onload = () => {
      google.accounts.id.initialize({ client_id: clientId, callback: (resp) => googleLogin(resp.credential) });
      google.accounts.id.renderButton($('#g-btn'), { theme: 'outline', size: 'large', shape: 'pill', text: 'continue_with', width: 320 });
    };
    s.onerror = () => { $('#g-btn').hidden = true; };   // Google yetib bo'lmasa (bloklangan) boshqa usullar qoladi
    document.head.appendChild(s);
  }

  // ── OAuth provayderlar (Yandex, Microsoft, Facebook) ───────────
  function setupProviders(list) {
    if (!list?.length) return;
    $('#social').hidden = false;
    $('#oa-btns').innerHTML = list.filter((p) => NAMES[p]).map((p) =>
      `<button type="button" class="sbtn" data-p="${p}">${ICONS[p]}${NAMES[p]} bilan davom etish</button>`).join('');
    $('#oa-btns').onclick = (e) => {
      const b = e.target.closest('[data-p]');
      if (!b) return;
      pending = b.dataset.p;
      location.href = demoMode ? './' : `/api/auth/${b.dataset.p}/start?code=${encodeURIComponent(inviteCode())}`;
    };
  }

  // Provayderdan qaytganda (/login?oa=...) xabar
  function showOAuthResult(why) {
    const text = {
      needcode: 'Birinchi marta kiryapsiz. Taklif kodini kiriting va tugmani yana bosing.',
      badcode: "Taklif kodi noto'g'ri yoki ishlatilgan. Kodni tekshirib, qayta urinib ko'ring.",
      denied: 'Kirishga ruxsat berilmadi.',
      blocked: 'Hisob bloklangan.',
      error: "Bu usul bilan kirib bo'lmadi. Qaytadan urinib ko'ring.",
    }[why];
    if (!text) return;
    if (why === 'needcode' || why === 'badcode') showCodebox(text);
    else $('#msg').textContent = text;
  }

  // ── Pochta orqali kod ──────────────────────────────────────────
  function setupEmail() {
    $('#social').hidden = false;
    $('#email-btn').hidden = false;
    $('#email-btn').onclick = () => { $('#emailbox').hidden = !$('#emailbox').hidden; if (!$('#emailbox').hidden) $('#em').focus(); };
  }
  async function emailSend() {
    $('#msg').textContent = '';
    if (demoMode) { $('#em-step2').hidden = false; $('#em-hint').textContent = 'Namoyish: kod yuborilmaydi. Istalgan 6 raqamni kiriting.'; return; }
    const btn = $('#em-send'); btn.disabled = true;
    try {
      const { r, j } = await post('/api/auth/email/start', { email: $('#em').value, code: inviteCode() });
      if (r.ok) {
        $('#em-step2').hidden = false;
        $('#em-hint').textContent = `${$('#em').value.trim()} manziliga kod yuborildi (10 daqiqa amal qiladi). Xat kelmasa, «Spam» papkasini ham tekshiring.`;
        $('#otp').focus();
      } else if (j.needCode) { pending = 'email'; showCodebox(); $('#msg').textContent = r.status === 428 ? '' : j.error; }
      else $('#msg').textContent = j.error || `Xato ${r.status}`;
    } finally { btn.disabled = false; }
  }
  async function emailVerify() {
    $('#msg').textContent = '';
    if (demoMode) { location.href = './'; return; }
    const btn = $('#em-verify'); btn.disabled = true;
    try {
      const { r, j } = await post('/api/auth/email/verify', { email: $('#em').value, otp: $('#otp').value, code: inviteCode() });
      if (r.ok) { goHome(); return; }
      if (/taklif/i.test(j.error || '')) showCodebox();
      $('#msg').textContent = j.error || `Xato ${r.status}`;
    } finally { btn.disabled = false; }
  }
  $('#em-send').onclick = emailSend;
  $('#em-verify').onclick = emailVerify;
  $('#otp').addEventListener('keydown', (e) => { if (e.key === 'Enter') emailVerify(); });
  $('#em').addEventListener('keydown', (e) => { if (e.key === 'Enter') emailSend(); });

  // Taklif kodi tugmasi: kutilayotgan usulga qarab davom etadi
  $('#gcode-go').onclick = () => {
    if (pending === 'google' && googleCredential) return googleLogin(googleCredential, $('#gcode').value);
    if (pending === 'email') return emailSend();
    if (pending && NAMES[pending]) { location.href = `/api/auth/${pending}/start?code=${encodeURIComponent($('#gcode').value)}`; return; }
    $('#msg').textContent = "Avval kirish usulini tanlang (Google, pochta...), keyin kodni kiriting.";
  };
  $('#gcode').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('#gcode-go').click(); } });

  fetch('/api/config').then((r) => r.json()).then((c) => {
    regMode = c.registration;
    $('#tabs').hidden = false;
    if (regMode === 'open') $('#code').placeholder = '(ixtiyoriy)';
    if (c.googleClientId) setupGoogle(c.googleClientId);
    setupProviders(c.providers);
    if (c.emailLogin) setupEmail();
    if (!$('#social').hidden) tuckForm();
    showOAuthResult(new URLSearchParams(location.search).get('oa'));
    // /login?kod=XXXXX-XXXXX havolasi bilan kelganda kod maydonlari to'ldiriladi va ro'yxatdan o'tish oynasi ochiladi
    const kod = new URLSearchParams(location.search).get('kod');
    if (kod) { $('#code').value = kod; $('#gcode').value = kod; mode = 'register'; openForm(); }
    apply();
  }).catch(() => {});

  $('#tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-mode]');
    if (b) { mode = b.dataset.mode; apply(); (mode === 'register' ? $('#code') : $('#username')).focus(); }
  });

  $('#form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('#go');
    btn.disabled = true;
    $('#msg').textContent = '';
    try {
      const body = { username: $('#username').value.trim(), password: $('#password').value };
      if (mode === 'register') body.code = $('#code').value;
      const { r, j } = await post(mode === 'register' ? '/api/register' : '/api/login', body);
      if (!r.ok) throw new Error(j.error || `Xato ${r.status}`);
      goHome();
    } catch (err) {
      $('#msg').textContent = err.message;
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
